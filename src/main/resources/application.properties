spring.application.name=frontline

# database postgresql
spring.datasource.url=${POSTGRESQL_URL}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Flyway
spring.flyway.locations=classpath:database/migrations
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Server
server.port=${SERVER_PORT:8080}

# Spring Security
security.jwt.secret=${JWT_SECRET:secret}
security.jwt.expiration=86400000

# HTTP
http.gamestats.api.secret=${GAMESTATS_API_SECRET_KEY}
http.gamestats.api.url=${GAMESTATS_API_URL}

# Spring Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Redis Configuration
spring.cache.type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
app.cache.redis.expiration=${CACHE_EXPIRATION:10}
